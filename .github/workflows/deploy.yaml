name: Deploy to ec2

on: 
    push: 
        branches: 
            - main

jobs: 
    deploy: 
        runs-on: ubuntu-latest

        steps: 
          - name: SSH deploy
            uses: appleboy/ssh-action@v1.0.3
            with: 
                host: ${{secrets.HOST}}
                username: ubuntu
                key: ${{secrets.SSH_KEY}}
                script: |
                    ssh -i /home/ubuntu/.ssh/gitmate.pem \
                    -o StrictHostKeyChecking=no \
                    ubuntu@10.0.2.10 <<'EOF'

                    set -e

                    echo "===== BACKEND DEPLOYMENT STARTED ====="
                    cd /var/www/gitmate
                    sudo git pull 
                    sudo pnpm install
                    sudo pnpm build 
                    sudo pm2 restart gitmate
                    echo "===== BACKEND DEPLOYMENT COMPLETED ====="

                    EOF

